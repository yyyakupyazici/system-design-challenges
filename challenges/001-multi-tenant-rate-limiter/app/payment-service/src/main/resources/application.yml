spring:
  application:
    name: paylink-payment-service
  threads:
    virtual:
      enabled: true

server:
  port: 8081
  shutdown: graceful

paylink:
  # Gerçek DB yazma gecikmesini simüle eder (demo)
  simulated-db-latency: ${SIMULATED_DB_LATENCY:20ms}
  public-link-base-url: ${PUBLIC_LINK_BASE_URL:https://pay.paylink.io/l/}

# Defense in depth: gateway limiti bir şekilde delinse bile (Redis fail-open, iç çağrı vb.)
# aynı anda en fazla N istek "DB'ye" gider; fazlası beklemeden 503 alır. Connection pool asla tükenmez.
resilience4j:
  bulkhead:
    instances:
      paymentDb:
        max-concurrent-calls: ${BULKHEAD_MAX_CONCURRENT:20}
        max-wait-duration: 0ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
