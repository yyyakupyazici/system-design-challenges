# Public giriş: sadece gateway. /admin dışarıya kapalı (iç erişim: kubectl port-forward / iç ingress).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paylink-public
  namespace: paylink
  annotations:
    # Katman 0: IP bazlı kaba limit (DDoS / geçersiz key spam'i gateway'e ulaşmadan)
    nginx.ingress.kubernetes.io/limit-rps: "2000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  rules:
    - host: api.paylink.local
      http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 80 } }
