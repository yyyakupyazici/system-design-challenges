# ÖRNEK! Gerçek ortamda bu dosyayı commitleme; şöyle oluştur:
#   kubectl -n paylink create secret generic paylink-secrets \
#     --from-literal=DB_USER=paylink --from-literal=DB_PASSWORD='...' \
#     --from-literal=ADMIN_TOKEN="$(openssl rand -hex 32)"
# Prod: External Secrets Operator / Sealed Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: paylink-secrets
  namespace: paylink
type: Opaque
stringData:
  DB_USER: paylink
  DB_PASSWORD: change-me
  ADMIN_TOKEN: change-me
