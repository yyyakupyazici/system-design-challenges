# Sadece iç ağdan erişim (ekiplerin servisleri). İnternete açık değil.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-gateway
  namespace: llm-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # SSE token'ları beklemeden geçsin
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8
spec:
  ingressClassName: nginx-internal
  rules:
    - host: llm-gateway.internal.paramix
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: llm-gateway, port: { number: 80 } } }
