# Lokal: PostgreSQL + Redis + Kafka + iki gateway + bir worker + payment-request-service (kendi veritabanıyla).
#   docker compose up --build
#   ws://localhost:8081/ws?userId=1&deviceId=phone   (gw-1)
#   ws://localhost:8082/ws?userId=2&deviceId=phone   (gw-2)  → mesajlar Redis Pub/Sub ile diğer gateway'e geçer
#   http://localhost:8090/v1/payment-requests         (para isteği: oluştur / öde / reddet) → kart sohbete olayla düşer
x-app: &app
  build: { context: ., dockerfile: app/Dockerfile }
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
    kafka: { condition: service_started }
  environment: &env
    DB_URL: jdbc:postgresql://postgres:5432/chat
    REDIS_HOST: redis
    KAFKA_BOOTSTRAP: kafka:9092
    KAFKA_PARTITIONS: "6"

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: chat, POSTGRES_USER: chat, POSTGRES_PASSWORD: chat }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U chat"], interval: 3s, retries: 20 }
  # Ayrı veritabanı = ayrı sahiplik. Sohbet servisi bu veritabanına erişmez; sadece payment.events olaylarını görür.
  payreq-postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: payreq, POSTGRES_USER: payreq, POSTGRES_PASSWORD: payreq }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U payreq"], interval: 3s, retries: 20 }
  redis:
    image: redis:7.4-alpine
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
  gw-1:
    <<: *app
    environment: { <<: *env, GATEWAY_NAME: gw-1, ROLE_RELAY: "false", ROLE_FANOUT: "false", ROLE_PAYMENT_CARDS: "false" }
    ports: ["8081:8080"]
  gw-2:
    <<: *app
    environment: { <<: *env, GATEWAY_NAME: gw-2, ROLE_RELAY: "false", ROLE_FANOUT: "false", ROLE_PAYMENT_CARDS: "false" }
    ports: ["8082:8080"]
  worker:
    <<: *app
    environment: { <<: *env, GATEWAY_NAME: worker, ROLE_GATEWAY: "false" }
  payment-request-service:
    build: { context: ., dockerfile: payment-request-service/Dockerfile }
    depends_on:
      payreq-postgres: { condition: service_healthy }
      kafka: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://payreq-postgres:5432/payreq
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_PARTITIONS: "6"
    ports: ["8090:8080"]
