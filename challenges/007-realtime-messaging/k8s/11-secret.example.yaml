# SADECE lokal/kind için. Prod'da External Secrets / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
  namespace: chat
type: Opaque
stringData:
  DB_USER: chat
  DB_PASSWORD: change-me
---
# payment-request-service'in KENDİ veritabanı kimliği: sohbet pod'ları bu secret'ı görmez.
apiVersion: v1
kind: Secret
metadata:
  name: payreq-secrets
  namespace: chat
type: Opaque
stringData:
  DB_USER: payreq
  DB_PASSWORD: change-me-too
