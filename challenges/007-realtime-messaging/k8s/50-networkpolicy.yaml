apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores
  namespace: chat
spec:
  podSelector:
    matchExpressions: [{ key: app, operator: In, values: [postgres, redis, kafka] }]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: chat-gateway } }
        - podSelector: { matchLabels: { app: chat-worker } }
    - from:
        - podSelector: { matchLabels: { app: kafka } }     # KRaft controller ↔ broker
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: chat
spec:
  podSelector: { matchLabels: { app: chat-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 8080 }]
