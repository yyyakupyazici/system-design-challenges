# Varsayılan: namespace'e gelen her şey kapalı; sadece gerekenler açık.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: notify
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# notify-api: ingress controller'dan (webhook/ack) ve bildirim gönderme yetkisi olan ekip namespace'lerinden
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-ingress
  namespace: notify
spec:
  podSelector: { matchLabels: { app: notify-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - namespaceSelector: { matchLabels: { paramix.io/notify-client: "true" } }
      ports: [{ port: 8080 }]
---
# Veri katmanı: sadece notify pod'ları erişebilir
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-from-notify
  namespace: notify
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [postgres, redis, kafka] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { part-of: notify } }
        - podSelector: { matchLabels: { app: kafka } }      # KRaft controller ↔ broker
---
# Prometheus scrape
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-monitoring
  namespace: notify
spec:
  podSelector: { matchLabels: { part-of: notify } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 8080 }]
