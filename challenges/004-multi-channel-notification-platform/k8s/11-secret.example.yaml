# Sadece lokal/kind için. Prod'da External Secrets / Sealed Secrets ile yönetilir, repoya konmaz.
# Gerçek sağlayıcı anahtarları (SMS operatörü, SES, FCM, APNs) da burada olurdu.
apiVersion: v1
kind: Secret
metadata:
  name: notify-secrets
  namespace: notify
type: Opaque
stringData:
  DB_USER: notify
  DB_PASSWORD: change-me
