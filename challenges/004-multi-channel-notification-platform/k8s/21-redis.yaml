# Kota ve kullanıcı cache'i. Demo: tek pod. Prod: Redis Cluster (kota key'leri hash tag'li: q:{smsA}:...).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: notify
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: notify
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # Kota verisi kaybolursa kovalar dolu başlar (en kötü ihtimalle birkaç saniyelik fazla gönderim);
          # kalıcılık gerekmez → AOF/RDB kapalı.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl"]
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 600Mi }
